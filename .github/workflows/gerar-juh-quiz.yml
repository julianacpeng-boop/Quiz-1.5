name: Gerar Juh Quiz - 6 Layouts

on:
  workflow_dispatch:
    inputs:
      layout:
        description: "Escolha o layout do vídeo"
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"
          - "6"

permissions:
  contents: read

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar FFmpeg e fontes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            ffmpeg \
            fonts-dejavu-core \
            fonts-liberation2 \
            fontconfig
          fc-cache -f

      - name: Instalar bibliotecas Python
        run: pip install -r requirements.txt

      - name: Gerar video
        env:
          LAYOUT: ${{ inputs.layout }}
        run: python -u gerar_video.py

      - name: Guardar MP4
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JUH-QUIZ-LAYOUT-${{ inputs.layout }}-${{ github.run_number }}
          path: output/*.mp4
          if-no-files-found: warn
          retention-days: 7
