name: Gerar Juh Quiz Neon

on:
  workflow_dispatch:
    inputs:
      layout:
        description: "Escolha o modelo do vídeo"
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "2"

permissions:
  contents: read

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      MODO_LAYOUT: ${{ inputs.layout }}

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar FFmpeg e fontes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation2 fontconfig

      - name: Instalar bibliotecas Python
        run: pip install -r requirements.txt

      - name: Mostrar modelo escolhido
        run: |
          echo "MODO_LAYOUT=${MODO_LAYOUT}"
          if [ "${MODO_LAYOUT}" = "1" ]; then
            echo "Modelo 1 = SEM IMAGEM"
          else
            echo "Modelo 2 = COM ESPAÇO REDONDO FIXO PARA IMAGEM"
          fi

      - name: Gerar vídeos
        run: python -u gerar_videos_neon.py

      - name: Guardar MP4
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JUH-QUIZ-NEON-MODO-${{ inputs.layout }}-${{ github.run_number }}
          path: output_neon/**/*.mp4
          if-no-files-found: error
          retention-days: 7
