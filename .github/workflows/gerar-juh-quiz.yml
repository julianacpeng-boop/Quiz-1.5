name: Gerar Juh Quiz - Multiplos Videos

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar FFmpeg e fontes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            ffmpeg \
            fonts-dejavu-core \
            fonts-liberation2 \
            fontconfig
          fc-cache -f

      - name: Instalar bibliotecas Python
        run: pip install -r requirements.txt

      - name: Gerar todos os videos cadastrados
        run: python -u gerar_video.py

      - name: Guardar todos os MP4
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JUH-QUIZ-MULTIPLOS-${{ github.run_number }}
          path: output/*.mp4
          if-no-files-found: warn
          retention-days: 7
